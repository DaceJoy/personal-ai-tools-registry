  downgraded BECAUSE this capability is occupied by crawl4ai, which is the strongest evidence it
  belongs here. TWO THINGS THIS SCHEMA CANNOT EXPRESS, stated here so no reader infers them wrong:
  (1) upstream_head above is the commit this entry was VERIFIED AGAINST, NOT what we run -- our
  image is digest-pinned unclecode/crawl4ai@sha256:9021b3cb5c6f built 2026-10-02, carries no
  org.opencontainers.image.version label, and upstream release v0.9.5 shipped 2026-10-14, so we
  are behind by an amount nobody has measured (this is FamilyPAI need N15 with a concrete instance).
  (2) maintained_by is community-individual (gh api users/unclecode -> type User), which under this
  repo's own rule means it SHOULD have a fork in the parent PersonalAI account as deletion
